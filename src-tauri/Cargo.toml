[package]
name = "glance"
version = "0.0.1"
description = "Glance"
authors = ["Glance"]
edition = "2024"

[lib]
name = "glance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glance-imaging = { path = "../crates/glance-imaging" }
tauri-plugin-dialog = "2"
thiserror = "2"
tauri-plugin-drag = "2.1.1"
walkdir = "2"
imagesize = "0.15.0"
blake3 = { version = "1.8.7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }

[target.'cfg(windows)'.dependencies]
trash = "5"

[dev-dependencies]
tempfile = "3"
dirs = "6"
