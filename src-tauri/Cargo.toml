[package]
name = "glance"
version = "1.0.0"
description = "Glance"
authors = ["Glance"]
edition = "2024"
publish = false
license = "GPL-3.0-only"

[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]

[lib]
name = "glance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glance-imaging = { path = "../crates/glance-imaging" }
glance-syscodec = { path = "../crates/glance-syscodec" }
tauri-plugin-dialog = "2"
thiserror = "2"
drag = "2.1.1"
walkdir = "2"
imagesize = "0.15.0"
blake3 = { version = "1.8.7", default-features = false }
notify-debouncer-full = "0.8.0"
kamadak-exif = "0.6.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.3"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = { version = "2.14.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString", "NSArray", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
trash = "5"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
glance-imaging = { path = "../crates/glance-imaging", features = ["testkit"] }
tempfile = "3"
dirs = "6"

# 集成测试 heic_display 用 CGImageDestination 现编 HEIC 样本。
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
