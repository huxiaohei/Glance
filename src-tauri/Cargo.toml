[package]
name = "glance"
version = "0.0.1"
description = "Glance"
authors = ["Glance"]
edition = "2024"

[lib]
name = "glance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glance-imaging = { path = "../crates/glance-imaging" }
