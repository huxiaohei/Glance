[package]
name = "glance-syscodec"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

# 用操作系统自带的编解码器把内存里的 HEIC / HEIF / AVIF 解成 RGBA8。
# macOS 走 ImageIO / CoreGraphics；其他目标（Windows 在接入 WIC 之前也算）编译 stub，恒返回 NoCodec。

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }

# 往返测试要在测试时用 CGImageDestination 编出 HEIC / AVIF 样本，并从位图上下文拿到 CGImage。
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageDestination", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }

[dev-dependencies]
glance-imaging = { path = "../glance-imaging" }
