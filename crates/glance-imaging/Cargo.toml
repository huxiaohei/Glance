[package]
name = "glance-imaging"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
color_quant = "1.1.0"
# 只关掉默认特性会同时关掉 std，而它要求 std 与 no_std 二选一：都不开时 x86_64 上缺 cpufeatures，编译失败。
fast_image_resize = { version = "6.2.0", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# 默认特性含 nasm_simd（需要 nasm）；这里关掉它，只保留 unwinding（错误转 panic，供 catch_unwind 捕获）
# 与 with_simd（arm64 走 NEON；x86 没有 nasm 时 build.rs 自动退回无 SIMD 实现）。
mozjpeg = { version = "0.10.13", default-features = false }
mozjpeg-sys = { version = "2.2.3", default-features = false, features = ["unwinding", "with_simd"] }
# 去掉 binary（命令行）、parallel、zopfli 默认特性，保持依赖精简。
oxipng = { version = "10.2.1", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
kamadak-exif = "0.6.2"
serde_json = "1"
